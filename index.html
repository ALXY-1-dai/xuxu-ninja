  // ---------- 状态 ----------
  const S = { IDLE: 'idle', PLAY: 'play', PAUSE: 'pause', OVER: 'over' };
  let state = S.IDLE;
  let score = 0, best = 0, lives = 3, timeAlive = 0;
  let heads = [], pieces = [], particles = [], popups = [], flashes = [], bursts = [];
  let trail = [];                 // {x, y, t}
  let spawnTimer = 1.0;

  let draggingVolume = false;

  try { best = parseInt(localStorage.getItem('headNinja.best') || '0', 10) || 0; } catch (e) { best = 0; }

  // ---------- 尺寸 ----------
  function resize() {
    const prevW = W, prevH = H, prevScale = SCALE;
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = cv.clientWidth || window.innerWidth;
    H = cv.clientHeight || window.innerHeight;
    cv.width = Math.max(1, Math.round(W * DPR));
    cv.height = Math.max(1, Math.round(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    G = H * 1.95;          // 重力，滞空约 1.6 秒
    // 参考网页复刻：640 宽的舞台里水果 60~126 px，也就是屏宽的 10%~20%
    SCALE = Math.min(W, H) * 0.21;

    // 窗口尺寸变了：把场上东西按比例挪回去，别留在屏幕外
    if (prevW > 0 && prevH > 0 && prevScale > 0) {
      const k = SCALE / prevScale, kx = W / prevW, ky = H / prevH;
      for (const h of heads) {
        h.size *= k; h.ra *= k; h.rb *= k;
        h.x = clamp(h.x * kx, -h.size * 0.5, W + h.size * 0.5);
        h.y = Math.min(h.y * ky, H + h.size);
      }
      for (const p of pieces) {
        p.size *= k;
        p.x = clamp(p.x * kx, -p.size * 0.5, W + p.size * 0.5);
        p.y = Math.min(p.y * ky, H + p.size);
      }
    }
    buildBG();
  }
  window.addEventListener('resize', resize);

  // ---------- 音效（无素材，现场合成） ----------
  let actx = null, muted = false, noiseBuf = null, lastSfxAt = -1, lastClangAt = -1, masterGain = null;

  function master(a) {
    if (!masterGain) { masterGain = a.createGain(); masterGain.connect(a.destination); }
    masterGain.gain.value = muted ? 0 : volume;
    return masterGain;
  }

  function setVolume(v) {
    volume = Math.min(1, Math.max(0, v));
    if (masterGain) masterGain.gain.value = muted ? 0 : volume;
    try { localStorage.setItem('headNinja.volume', String(volume)); } catch (e) {}
  }

  function audio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }

    if (actx && actx.state === 'suspended') { try { actx.resume(); } catch (e) {} }
    return actx;
  }
  function getNoise(a) {
    if (!noiseBuf) {
      noiseBuf = a.createBuffer(1, 2048, a.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    }
    return noiseBuf;
  }
  function sfxSlice() {
    const a = audio(); if (!a || muted) return;
    const t = a.currentTime;
    // 一刀切好几个时别叠成一串爆音
    if (t - lastSfxAt < 0.05) return;
    lastSfxAt = t;
    const src = a.createBufferSource(); src.buffer = getNoise(a);
    const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.6;
    bp.frequency.setValueAtTime(2600, t);
    bp.frequency.exponentialRampToValueAtTime(500, t + 0.16);
    const g = a.createGain();
    g.gain.setValueAtTime(0.2, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.20);
    src.connect(bp); bp.connect(g); g.connect(master(a));
    src.start(t); src.stop(t + 0.22);
  }
  function sfxMiss() {
    const a = audio(); if (!a || muted) return;
    const t = a.currentTime + 0.02;
    const o = a.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(60, t + 0.22);
    const g = a.createGain();
    g.gain.setValueAtTime(0.18, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.24);
    o.connect(g); g.connect(master(a)); o.start(t); o.stop(t + 0.26);
  }
  // 砍到连斩头：金属感的“叮”
  function sfxClang() {
    const a = audio(); if (!a || muted) return;
    const t = a.currentTime;
    if (t - lastClangAt < 0.04) return;   // 连划时别把声音叠成噪音
    lastClangAt = t;
    const o = a.createOscillator(); o.type = 'square';
    o.frequency.setValueAtTime(620, t);
    o.frequency.exponentialRampToValueAtTime(180, t + 0.12);
    const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 500;
    const g = a.createGain();
    g.gain.setValueAtTime(0.10, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.14);
    o.connect(f); f.connect(g); g.connect(master(a));
    o.start(t); o.stop(t + 0.16);
  }
  // 暴击：上扬的清脆高音
  function sfxCrit() {
    const a = audio(); if (!a || muted) return;
    const t = a.currentTime;
    const o = a.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(880, t);
    o.frequency.exponentialRampToValueAtTime(1760, t + 0.1);
    const g = a.createGain();
    g.gain.setValueAtTime(0.12, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.2);
    o.connect(g); g.connect(master(a));
    o.start(t); o.stop(t + 0.22);
  }
  window.addEventListener('keydown', e => {
    if (e.key === 'm' || e.key === 'M') { muted = !muted; if (masterGain) masterGain.gain.value = muted ? 0 : volume; }
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { togglePause(); }
  });

  // 切到后台就自动暂停，别让头像白白掉下去
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === S.PLAY) togglePause();
  });

  // ---------- 暂停 / 菜单 ----------
  function togglePause() {
    if (state === S.PLAY) {
      state = S.PAUSE;
      pressed = false; lastPt = null; trail.length = 0; draggingVolume = false;
    } else if (state === S.PAUSE) {
      state = S.PLAY;
      spawnTimer = Math.max(spawnTimer, 0.35);
    }
  }

  const inRect = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

  // 暂停菜单的按钮/滑条位置：画和点共用这一套坐标
  function pauseUI() {
    const bw = Math.min(260, W * 0.66), bh = Math.min(50, H * 0.062), gap = Math.min(16, H * 0.02);
    const cx = W / 2;
    let y = H * 0.34;
    const resume = { x: cx - bw / 2, y, w: bw, h: bh };
    y += bh + gap;
    const restart = { x: cx - bw / 2, y, w: bw, h: bh };
    y += bh + gap;
    const quit = { x: cx - bw / 2, y, w: bw, h: bh };
    y += bh + gap + Math.min(26, H * 0.035);
    const track = { x: cx - bw / 2, y, w: bw, h: 6 };
    return { resume, restart, quit, track };
  }

  function pauseBtnRect() {
    return { x: W / 2 - 22, y: 14, w: 44, h: 34 };
  }

  function setVolumeFromX(x, track) {
    if (muted && x > track.x) muted = false;
    setVolume((x - track.x) / track.w);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---------- 工具 ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  // 线段到点距离，判断是否切到椭圆（在椭圆归一化空间里当圆处理）
  function segHitsEllipse(ax, ay, bx, by, cx, cy, rot, ra, rb) {
    const c = Math.cos(-rot), s = Math.sin(-rot);
    const x1 = (ax - cx) * c - (ay - cy) * s;
    const y1 = (ax - cx) * s + (ay - cy) * c;
    const x2 = (bx - cx) * c - (by - cy) * s;
    const y2 = (bx - cx) * s + (by - cy) * c;
    // 归一化到单位圆
    const px1 = x1 / ra, py1 = y1 / rb, px2 = x2 / ra, py2 = y2 / rb;
    const dx = px2 - px1, dy = py2 - py1;
    const len2 = dx * dx + dy * dy;
    let t = len2 ? (-px1 * dx - py1 * dy) / len2 : 0;
    t = clamp(t, 0, 1);
    const qx = px1 + t * dx, qy = py1 + t * dy;
    return qx * qx + qy * qy <= 1;
  }

  // ---------- 生成 ----------
  function spawnHead(forceX) {
    const idx = Math.floor(Math.random() * SPRITES.length);
    const sp = SPRITES[idx];
    const size = SCALE * sp.w * rand(0.78, 1.15);
    const x = forceX != null ? clamp(forceX, W * 0.08, W * 0.92) : rand(W * 0.12, W * 0.88);
    const y = H + size * 0.55 + 20;
    const apex = rand(0.58, 0.98);                      // 想要冲到屏幕多高
    const vy = -Math.sqrt(2 * G * apex * H);
    const vx = clamp((W * 0.5 - x) * rand(0.8, 1.35), -W * 0.6, W * 0.6);
    // 连斩头：分数上去以后才会出现，一直划一直加，停手才裂开
    const charged = score > 50 && Math.random() < 0.03;   // 大约 30~40 个里出一个
    heads.push({
      i: idx, x, y, vx, vy, size,
      ra: size * sp.ax, rb: size * sp.ay,
      rot: rand(0, Math.PI * 2),
      // 平面内自转：参考老版网页复刻的 40~60°/s，这里给 2~4.5 rad/s（约 115~260°/s）
      spin: rand(2.0, 4.5) * (Math.random() < 0.5 ? -1 : 1),
      charged, chain: 0, chargeT0: -1, chargePrev: -9, hitFlash: 0,
      alive: true,
    });
    // 第一次见到连斩头给一句提示，不然不知道要一直划
    if (charged && state === S.PLAY && popups.length < 24) {
      popups.push({ x: W * 0.5, y: H * 0.16, text: '连斩头：一直划别停', life: 1.4, maxLife: 1.4, size: 20, color: '255,190,120' });
    }
  }

  // 同屏最多几个：4 个起，每 120 分 +1，最多 6 个
  function volleyLimit() {
    return Math.min(6, 4 + Math.floor(score / 120));
  }

  // 一次掷出 1~4 个：不是每次单发，偶尔成批上来（最多 4 个，受同屏上限约束）
  let pendingSpawns = [];
  function trySpawnVolley() {
    const room = volleyLimit() - heads.length - pendingSpawns.length;
    if (room <= 0) return;
    const r = Math.random();
    let n = r < 0.58 ? 1 : r < 0.83 ? 2 : r < 0.95 ? 3 : 4;
    n = Math.min(n, room, 4);
    for (let i = 0; i < n; i++) {
      // 成批时左右铺开，别叠在一起
      const f = n === 1 ? rand(0.15, 0.85) : 0.18 + 0.64 * i / (n - 1) + rand(-0.05, 0.05);
      pendingSpawns.push({ at: timeAlive + i * 0.13, x: W * clamp(f, 0.1, 0.9) });
    }
  }

  function scheduleSpawn() {
    const base = Math.max(0.95, 1.55 - timeAlive * 0.012);
    spawnTimer = base * rand(0.9, 1.15);
  }

  // 把位图（整头或碎片都行）按切线裁成一半，并重画切面亮边
  function makePieceBitmap(src, size, cutAngle, cutOffset, side) {
    const px = Math.max(2, Math.ceil(size * DPR));
    const c = document.createElement('canvas');
    c.width = px; c.height = px;
    const g = c.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.translate(size / 2, size / 2);
    const R = size;
    g.save();
    g.rotate(cutAngle);
    g.beginPath();
    if (side < 0) g.rect(-R, -R, 2 * R, R + cutOffset);
    else g.rect(-R, cutOffset, 2 * R, R - cutOffset);
    g.clip();
    g.rotate(-cutAngle);
    g.drawImage(src, -size / 2, -size / 2, size, size);
    g.restore();

    // 切面：一条亮边 + 内侧薄薄一层粉白，假装有断面
    g.save();
    g.globalCompositeOperation = 'source-atop';
    g.translate(size / 2, size / 2);
    g.rotate(cutAngle);
    const band = g.createLinearGradient(0, cutOffset, 0, cutOffset + side * 8);
    band.addColorStop(0, 'rgba(255,240,255,0.26)');
    band.addColorStop(1, 'rgba(255,214,240,0)');
    g.fillStyle = band;
    g.fillRect(-size * 0.5, Math.min(cutOffset, cutOffset + side * 8), size, 8);
    const lg = g.createLinearGradient(-size * 0.5, 0, size * 0.5, 0);
    lg.addColorStop(0, 'rgba(255,255,255,0)');
    lg.addColorStop(0.5, 'rgba(255,255,255,0.7)');
    lg.addColorStop(1, 'rgba(255,255,255,0)');
    g.strokeStyle = lg;
    g.lineWidth = 1.6;
    g.shadowColor = 'rgba(255,230,255,0.7)';
    g.shadowBlur = 6;
    g.beginPath();
    g.moveTo(-size * 0.5, cutOffset);
    g.lineTo(size * 0.5, cutOffset);
    g.stroke();
    g.restore();
    return c;
  }

  // 数一下这张位图里不透明的像素占比，用来判断切下来的两半是不是有一边太小
  function alphaCoverage(bmp) {
    try {
      const N = 24;
      const c = document.createElement('canvas');
      c.width = c.height = N;
      const g = c.getContext('2d');
      g.drawImage(bmp, 0, 0, N, N);
      const d = g.getImageData(0, 0, N, N).data;
      let n = 0;
      for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 40) n++;
      return n / (N * N);
    } catch (e) {
      return 1;   // file:// 下读不了像素就当没问题，别让它反复重切
    }
  }

  function makePiece(src, size, x, y, vx, vy, rot, cutAngle, cutOffset, side, kick, prebuilt) {
    if (pieces.length > 80) return;             // 别让碎片无限堆积
    const bmp = prebuilt || makePieceBitmap(src, size, cutAngle, cutOffset, side);
    if (!bmp) return;
    // 切面法线（本地 (-sin,cos) 转回世界），碎片朝两侧弹开
    const nx = -Math.sin(cutAngle) * Math.cos(rot) - Math.cos(cutAngle) * Math.sin(rot);
    const ny = -Math.sin(cutAngle) * Math.sin(rot) + Math.cos(cutAngle) * Math.cos(rot);
    pieces.push({
      size, bmp,
      x: x + nx * side * 3, y: y + ny * side * 3,
      vx: vx + nx * side * kick,
      vy: vy + ny * side * kick - rand(0, 40),   // 稍微往上带一点，别一上来就往下坠
      rot, vrot: side * rand(1.2, 2.6),
      life: 2.2, maxLife: 2.2,
    });
  }

  // ---------- 切开 ----------
  // 暴击率：普通头 15%，连斩头要快速连划，给到 18%
  const CRIT_NORMAL = 0.15;
  const CRIT_CHARGE = 0.18;

  // 把刀刃线段换算成「这块东西本地坐标里的切线角度 + 相对中心的偏移」
  // 偏移会按椭圆在那个方向上的半径收一下，避免切出 99:1 那种一条细线的碎片
  function cutParams(o, ax, ay, bx, by) {
    const c = Math.cos(-o.rot), s = Math.sin(-o.rot);
    const lx1 = (ax - o.x) * c - (ay - o.y) * s;
    const ly1 = (ax - o.x) * s + (ay - o.y) * c;
    const lx2 = (bx - o.x) * c - (by - o.y) * s;
    const ly2 = (bx - o.x) * s + (by - o.y) * c;
    let dx = lx2 - lx1, dy = ly2 - ly1;
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    const cutAngle = Math.atan2(dy, dx);
    // 法线方向上椭圆的半径（切线的垂线方向）
    const nx = -dy, ny = dx;
    const ra = o.ra || o.size * 0.44;
    const rb = o.rb || o.size * 0.44;
    const rn = 1 / Math.sqrt((nx / ra) * (nx / ra) + (ny / rb) * (ny / rb));
    // 偏移最多吃到 0.55 倍半径，两边面积最悬殊也就 17:83 左右
    const lim = Math.min(o.size * 0.30, rn * 0.55);
    return {
      cutAngle,
      cutOffset: clamp(lx1 * -dy + ly1 * dx, -lim, lim),
    };
  }

  function slice(head, ax, ay, bx, by) {
    head.alive = false;
    const cut = cutParams(head, ax, ay, bx, by);

    const img = imgs[head.i];
    if (img) {
      // 先按算出来的偏移切；如果一边明显比另一边小（快成细条了），就一点点往中间收
      let off = cut.cutOffset;
      let bA = null, bB = null;
      for (let tries = 0; tries < 5; tries++) {
        bA = makePieceBitmap(img, head.size, cut.cutAngle, off, -1);
        bB = makePieceBitmap(img, head.size, cut.cutAngle, off, 1);
        const ca = alphaCoverage(bA), cb = alphaCoverage(bB);
        const big = Math.max(ca, cb, 1e-6);
        if (Math.min(ca, cb) / big >= 0.32 && Math.min(ca, cb) >= 0.02) break;
        if (Math.abs(off) < head.size * 0.03) break;
        off *= 0.6;
      }
      const kick = rand(120, 190);
      for (const side of [-1, 1]) {
        makePiece(img, head.size, head.x, head.y, head.vx * 0.7, head.vy * 0.6, head.rot,
          cut.cutAngle, off, side, kick, side < 0 ? bA : bB);
      }
    }

    // 粒子
    for (let k = 0; k < 26 && particles.length < 400; k++) {
      const a = rand(0, Math.PI * 2), sp = rand(60, 460);
      particles.push({
        x: head.x + rand(-head.size * 0.18, head.size * 0.18),
        y: head.y + rand(-head.size * 0.18, head.size * 0.18),
        vx: Math.cos(a) * sp + head.vx * 0.25,
        vy: Math.sin(a) * sp + head.vy * 0.25,
        r: rand(1.5, 5.5),
        life: rand(0.35, 0.9), maxLife: 0.9,
        color: Math.random() < 0.5 ? '203,168,255' : (Math.random() < 0.6 ? '255,168,214' : '255,255,255'),
      });
    }
    if (flashes.length < 30) flashes.push({ ax, ay, bx, by, life: 0.16, maxLife: 0.16 });

    // ---- 计分：原版规则是「一刀切到 3 个以上，这一刀的分数翻倍」+ 随机暴击 +10 ----
    swipeCuts += 1;
    let gain = 10;
    if (!swipeDoubled && swipeCuts >= 3) {
      swipeDoubled = true;
      score += 20;                 // 补上前两刀没翻倍的差额
      gain = 20;
    } else if (swipeDoubled) {
      gain = 20;
    }
    const crit = Math.random() < CRIT_NORMAL;
    if (crit) {
      gain += 10;
      bursts.push({ x: head.x, y: head.y, t: 0, dur: 0.5 });
      sfxCrit();
    }
    score += gain;
    if (popups.length < 24) {
      popups.push({
        x: head.x, y: head.y - head.size * 0.25,
        text: (crit ? '暴击 ' : '') + '+' + gain,
        life: crit ? 0.85 : 0.7, maxLife: crit ? 0.85 : 0.7,
        size: crit ? 27 : 22,
        color: crit ? '255,214,120' : '255,255,255',
      });
    }
    if (swipeDoubled) showBanner('combo', swipeCuts + ' 连斩 · 分数翻倍', H * 0.30);
    shake = Math.min(12, shake + 4 + Math.min(swipeCuts, 6) * 0.6);
    sfxSlice();
    hintAlpha = 0;
  }

  // 横幅只留一条，数字就地刷新；连击（一刀多切）和连斩（一直划）各占一行，互不覆盖
  function showBanner(key, text, y) {
    const ex = popups.find(p => p.banner === key);
    if (ex) { ex.text = text; ex.life = ex.maxLife; ex.y = y; return; }
    popups.push({ banner: key, x: W * 0.5, y, text, life: 0.9, maxLife: 0.9, size: 34, color: '255,214,120' });
  }

  // 连斩头上限：最多 20 刀 / 4 秒，停手 0.45 秒就结束
  const CHARGE_MAX_HITS = 20;
  const CHARGE_IDLE = 0.45;
  const CHARGE_MAX_AGE = 4.0;

  // 连斩头：不用切成小块，一直划就一直加分（连击、暴击都算），
  // 可以一直连到 20 刀；停手 0.45 秒、或者从第一刀算起满 4 秒，就裂成两半
  function hitCharged(h, ax, ay, bx, by) {
    const t = timeAlive;
    if (h.chargeT0 < 0) h.chargeT0 = t;
    h.chain = (t - h.chargePrev < 0.6) ? h.chain + 1 : 1;
    h.chargePrev = t;
    h.hitFlash = 0.35;

    let gain = 4 + Math.min(h.chain, 12) * 2;
    const crit = Math.random() < CRIT_CHARGE;
    if (crit) {
      gain += 10;
      bursts.push({ x: h.x, y: h.y, t: 0, dur: 0.45 });
      sfxCrit();
    }
    score += gain;
    if (popups.length < 24) {
      popups.push({
        x: h.x, y: h.y - h.size * 0.3,
        text: (crit ? '暴击 ' : '') + '+' + gain,
        life: 0.5, maxLife: 0.5,
        size: crit ? 24 : 18,
        color: crit ? '255,214,120' : '255,236,190',
      });
    }
    if (h.chain >= 3) showBanner('chain', h.chain + ' 连斩 · 持续加分', H * 0.21);
    if (flashes.length < 30) flashes.push({ ax, ay, bx, by, life: 0.12, maxLife: 0.12 });
    for (let k = 0; k < 8 && particles.length < 400; k++) {
      const a = rand(0, Math.PI * 2), sp = rand(70, 300);
      particles.push({
        x: h.x, y: h.y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        r: rand(1, 2.6), life: rand(0.2, 0.45), maxLife: 0.45,
        color: Math.random() < 0.5 ? '255,214,150' : '255,255,255',
      });
    }
    shake = Math.min(12, shake + 1.8);
    sfxClang();

    // 砍满上限就当场裂开，别让它拖着
    if (h.chain >= CHARGE_MAX_HITS) burstCharged(h);
  }

  // 停手/超时：收尾奖励 + 横着裂成两半
  function burstCharged(h) {
    if (!h.alive) return;
    const bonus = 8 + Math.min(h.chain, CHARGE_MAX_HITS) * 2;
    score += bonus;
    if (popups.length < 24) {
      popups.push({ x: h.x, y: h.y - h.size * 0.4, text: '裂开！+' + bonus, life: 0.85, maxLife: 0.85, size: 24, color: '255,190,120' });
    }
    for (let k = 0; k < 18 && particles.length < 400; k++) {
      const a = rand(0, Math.PI * 2), sp = rand(120, 420);
      particles.push({
        x: h.x, y: h.y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        r: rand(1.2, 3.2), life: rand(0.2, 0.5), maxLife: 0.5,
        color: Math.random() < 0.5 ? '255,190,120' : '255,255,255',
      });
    }
    shake = Math.min(14, shake + 5);
    slice(h, h.x - h.size * 0.5, h.y, h.x + h.size * 0.5, h.y);
  }

  // ---------- 输入 ----------
  function pushPoint(x, y) {
    const now = performance.now();
    trail.push({ x, y, t: now });
    while (trail.length > 1 && now - trail[0].t > 180) trail.shift();
  }

  function testSlice(ax, ay, bx, by) {
    if (state !== S.PLAY) return;
    const segLen = Math.hypot(bx - ax, by - ay);
    if (segLen < 3) return;
    for (const h of heads) {
      if (!h.alive) continue;
      if (segHitsEllipse(ax, ay, bx, by, h.x, h.y, h.rot, h.ra, h.rb)) {
        // 连斩头：这一刀只算砍中，继续划继续加；停手或超时才裂开
        if (h.charged) hitCharged(h, ax, ay, bx, by);
        else slice(h, ax, ay, bx, by);
      }
    }
  }

  let lastPt = null;
  let pressed = false;
  function onDown(e) {
    if (state === S.PAUSE) {
      // 暂停菜单：继续 / 重开 / 退出 / 音量条
      const ui = pauseUI();
      if (inRect(ui.resume, e.clientX, e.clientY)) { togglePause(); return; }
      if (inRect(ui.restart, e.clientX, e.clientY)) { startGame(); return; }
      if (inRect(ui.quit, e.clientX, e.clientY)) { state = S.IDLE; return; }
      const t = ui.track;
      if (e.clientY >= t.y - 26 && e.clientY <= t.y + 26 && e.clientX >= t.x - 12 && e.clientX <= t.x + t.w + 12) {
        draggingVolume = true;
        setVolumeFromX(e.clientX, t);
      }
      return;
    }
    if (state !== S.PLAY) { startGame(); return; }
    // 顶上的暂停按钮优先于切
    if (inRect(pauseBtnRect(), e.clientX, e.clientY)) { togglePause(); return; }

    pressed = true;
    swipeCuts = 0;
    swipeDoubled = false;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    lastPt = { x: e.clientX, y: e.clientY };
    trail.length = 0;
    pushPoint(e.clientX, e.clientY);
    // 直接点在头像上也能切开
    for (const h of heads) {
      if (!h.alive) continue;
      if (segHitsEllipse(e.clientX - 1, e.clientY, e.clientX + 1, e.clientY, h.x, h.y, h.rot, h.ra, h.rb)) {
        if (h.charged) hitCharged(h, e.clientX - 20, e.clientY - 14, e.clientX + 20, e.clientY + 14);
        else slice(h, e.clientX - 26, e.clientY - 18, e.clientX + 26, e.clientY + 18);
      }
    }
  }
  function onMove(e) {
    if (draggingVolume) {
      setVolumeFromX(e.clientX, pauseUI().track);
      return;
    }
    if (state !== S.PLAY || !pressed) return;
    const x = e.clientX, y = e.clientY;
    if (!lastPt) { lastPt = { x, y }; pushPoint(x, y); return; }
    if (Math.hypot(x - lastPt.x, y - lastPt.y) < 1.2) return;
    testSlice(lastPt.x, lastPt.y, x, y);
    lastPt = { x, y };
    pushPoint(x, y);
  }
  function onUp() { pressed = false; lastPt = null; draggingVolume = false; }

  cv.addEventListener('pointerdown', onDown);
  cv.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  window.addEventListener('blur', onUp);
  cv.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- 生命周期 ----------
  function startGame() {
    audio();
    state = S.PLAY;
    score = 0; lives = 3; timeAlive = 0;
    swipeCuts = 0; swipeDoubled = false;
    heads = []; pieces = []; particles = []; popups = []; flashes = []; bursts = [];
    pendingSpawns = [];
    trail.length = 0; lastPt = null; pressed = false; draggingVolume = false;
    spawnTimer = 0.55;
    hintAlpha = 1;
    shake = 0; redFlash = 0;
  }

  function gameOver() {
    state = S.OVER;
    if (score > best) {
      best = score;
      try { localStorage.setItem('headNinja.best', String(best)); } catch (e) {}
    }
  }

  // ---------- 更新 ----------
  const STEP = 1 / 120;
  function step(dt) {
    if (state === S.PAUSE) return;      // 暂停时整局冻住，只保留绘制
    if (state === S.PLAY) {
      timeAlive += dt;
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        trySpawnVolley();
        scheduleSpawn();
      }
      // 批量掷出的，按各自的时间点陆续从下沿冒出来
      while (pendingSpawns.length && pendingSpawns[0].at <= timeAlive) {
        spawnHead(pendingSpawns.shift().x);
      }
    }

    for (const h of heads) {
      if (!h.alive) continue;
      // 连斩头：正在被划的时候几乎悬停，方便一路划下去；停手 0.55 秒或满 3 秒就裂开
      if (h.charged) {
        const beingCut = h.chargePrev > 0 && (timeAlive - h.chargePrev) < CHARGE_IDLE;
        if (beingCut) { h.vy *= Math.pow(0.12, dt); h.vx *= Math.pow(0.3, dt); }
        else h.vy += G * dt;
        const idle = h.chargeT0 >= 0 ? timeAlive - h.chargePrev : 0;
        const age = h.chargeT0 >= 0 ? timeAlive - h.chargeT0 : 0;
        if (state === S.PLAY && h.chargeT0 >= 0 && (idle > CHARGE_IDLE || age > CHARGE_MAX_AGE)) {
          burstCharged(h);
          continue;
        }
      } else {
        h.vy += G * dt;
      }
      h.x += h.vx * dt;
      h.y += h.vy * dt;
      h.rot += h.spin * dt;
      if (h.hitFlash > 0) h.hitFlash = Math.max(0, h.hitFlash - dt * 2.6);
      // 整个头掉出屏幕下沿就算漏，别等它飘到屏幕外老远才扣命
      if (h.y - h.size * 0.25 > H && h.vy > 0) {
        h.alive = false;
        if (state === S.PLAY) {
          lives -= 1;
          redFlash = 0.5;
          shake = Math.min(14, shake + 6);
          sfxMiss();
          if (lives <= 0) gameOver();
        }
      }
    }
    heads = heads.filter(h => h.alive);

    for (const h of pieces) {
      h.vy += G * 0.45 * dt;      // 碎片掉得慢，留出"再补一刀"的时间
      const drag = Math.pow(0.9, dt);
      h.vx *= drag;
      h.vy *= Math.pow(0.97, dt);
      h.x += h.vx * dt;
      h.y += h.vy * dt;
      h.rot += h.vrot * dt;
      h.life -= dt;
    }
    pieces = pieces.filter(h => !h.dead && h.life > 0 && h.y < H + h.size * 1.5);

    for (const p of particles) {
      p.vy += G * 0.55 * dt;
      p.vx *= 0.985;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);

    for (const p of popups) { p.life -= dt; p.y -= 42 * dt; }
    popups = popups.filter(p => p.life > 0);

    for (const f of flashes) f.life -= dt;
    flashes = flashes.filter(f => f.life > 0);

    for (const b of bursts) b.t += dt;
    bursts = bursts.filter(b => b.t < b.dur);

    shake *= Math.pow(0.0025, dt);
    redFlash = Math.max(0, redFlash - dt * 1.6);
    hintAlpha = Math.max(0, hintAlpha - dt * 0.35);
  }

  // ---------- 绘制 ----------
  let bgGrad = null, bgGlow = null;

  function buildBG() {
    bgGrad = ctx.createRadialGradient(W * 0.5, H * 0.42, 40, W * 0.5, H * 0.5, Math.max(W, H) * 0.85);
    bgGrad.addColorStop(0, '#241f36');
    bgGrad.addColorStop(0.55, '#171426');
    bgGrad.addColorStop(1, '#0c0a13');
    bgGlow = ctx.createRadialGradient(W * 0.5, H * 0.55, 10, W * 0.5, H * 0.55, Math.min(W, H) * 0.55);
    bgGlow.addColorStop(0, 'rgba(120,86,190,0.16)');
    bgGlow.addColorStop(1, 'rgba(120,86,190,0)');
  }

  function drawBG() {
    ctx.fillStyle = bgGrad || '#141122';
    ctx.fillRect(0, 0, W, H);
    if (!bgGlow) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = bgGlow;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  function drawHead(h) {
    const img = imgs[h.i];
    if (!img) return;
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.rotate(h.rot);
    // 背后一层柔光：深色的头像（比如银河脸）才能从暗背景里跳出来
    ctx.save();
    ctx.shadowColor = 'rgba(168,148,245,0.5)';
    ctx.shadowBlur = Math.max(14, h.size * 0.13);
    ctx.drawImage(img, -h.size / 2, -h.size / 2, h.size, h.size);
    ctx.restore();
    ctx.restore();

    // 打光在屏幕空间里，不跟着物体转：转起来高光位置不动，才像真在自转
    ctx.save();
    ctx.translate(h.x, h.y);
    const r = Math.max(h.ra, h.rb) * 1.08;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.clip();
    ctx.globalCompositeOperation = 'overlay';
    const gg = ctx.createRadialGradient(-r * 0.38, -r * 0.42, r * 0.05, 0, 0, r * 1.15);
    gg.addColorStop(0, 'rgba(255,255,255,0.20)');
    gg.addColorStop(0.5, 'rgba(255,255,255,0)');
    gg.addColorStop(1, 'rgba(0,0,0,0.16)');
    ctx.fillStyle = gg;
    ctx.fillRect(-r, -r, r * 2, r * 2);
    ctx.restore();

    // 连斩头：转动的虚线环 + 剩余时间弧 + 连击数
    if (h.charged) {
      const R = Math.max(h.ra, h.rb) * 1.16;
      const idleLeft = 1 - clamp((timeAlive - h.chargePrev) / CHARGE_IDLE, 0, 1);
      const ageLeft = h.chargeT0 >= 0 ? 1 - clamp((timeAlive - h.chargeT0) / CHARGE_MAX_AGE, 0, 1) : 1;
      const k = Math.max(0, Math.min(idleLeft, ageLeft));
      ctx.save();
      ctx.translate(h.x, h.y);
      ctx.save();
      ctx.rotate(performance.now() / 1000);
      ctx.setLineDash([R * 0.28, R * 0.22]);
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = 'rgba(255,170,120,0.55)';
      ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      ctx.setLineDash([]);
      ctx.strokeStyle = 'rgba(255,205,120,0.9)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, 0, R - 6, -Math.PI / 2, -Math.PI / 2 + k * Math.PI * 2);
      ctx.stroke();
      if (h.hitFlash > 0) {
        ctx.strokeStyle = 'rgba(255,255,255,' + Math.min(1, h.hitFlash * 2.2) + ')';
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(0, 0, R + 10 * h.hitFlash, 0, Math.PI * 2); ctx.stroke();
      }
      if (h.chain >= 2) {
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        font(Math.min(26, h.size * 0.22), 800);
        ctx.fillStyle = 'rgba(255,214,120,' + (0.7 + 0.3 * Math.min(1, h.hitFlash * 4)) + ')';
        ctx.fillText('×' + h.chain, 0, -R - 12);
      }
      ctx.restore();
    }
  }

  function drawPiece(h) {
    if (!h.bmp) return;
    const fade = h.life < 0.6 ? h.life / 0.6 : 1;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(h.x, h.y);
    ctx.rotate(h.rot);
    ctx.drawImage(h.bmp, -h.size / 2, -h.size / 2, h.size, h.size);
    ctx.restore();
  }

  function trailRibbon(pts, k) {
    ctx.beginPath();
    const n = pts.length;
    for (let i = 0; i < n; i++) {
      const prev = pts[Math.max(0, i - 1)];
      const next = pts[Math.min(n - 1, i + 1)];
      let dx = next.x - prev.x, dy = next.y - prev.y;
      const l = Math.hypot(dx, dy) || 1;
      const w = (2.2 + 11 * pts[i].age) * k;
      const nx = -dy / l * w, ny = dx / l * w;
      if (i === 0) ctx.moveTo(pts[0].x + nx, pts[0].y + ny);
      else ctx.lineTo(pts[i].x + nx, pts[i].y + ny);
    }
    for (let i = n - 1; i >= 0; i--) {
      const prev = pts[Math.max(0, i - 1)];
      const next = pts[Math.min(n - 1, i + 1)];
      let dx = next.x - prev.x, dy = next.y - prev.y;
      const l = Math.hypot(dx, dy) || 1;
      const w = (2.2 + 11 * pts[i].age) * k;
      ctx.lineTo(pts[i].x + dy / l * w, pts[i].y - dx / l * w);
    }
    ctx.closePath();
  }

  function drawTrail() {
    if (trail.length < 2) return;
    const now = performance.now();
    const pts = [];
    for (const p of trail) {
      const age = 1 - clamp((now - p.t) / 180, 0, 1);
      if (age > 0.02) pts.push({ x: p.x, y: p.y, age });
    }
    if (pts.length < 2) return;

    const g = ctx.createLinearGradient(pts[0].x, pts[0].y, pts[pts.length - 1].x, pts[pts.length - 1].y);
    g.addColorStop(0, 'rgba(150,120,255,0)');
    g.addColorStop(0.6, 'rgba(190,160,255,0.20)');
    g.addColorStop(1, 'rgba(255,255,255,0.55)');

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // 外层：紫白拖尾
    trailRibbon(pts, 1);
    ctx.fillStyle = g;
    ctx.shadowColor = 'rgba(190,160,255,0.9)';
    ctx.shadowBlur = 22;
    ctx.fill();
    // 内芯：细亮线
    ctx.shadowBlur = 0;
    trailRibbon(pts, 0.34);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fill();
    ctx.restore();
  }

  function drawParticles() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const p of particles) {
      const a = clamp(p.life / p.maxLife, 0, 1);
      ctx.fillStyle = 'rgba(' + p.color + ',' + a * 0.9 + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (0.4 + a * 0.8), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawFlashes() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const f of flashes) {
      const a = f.life / f.maxLife;
      ctx.strokeStyle = 'rgba(255,255,255,' + a + ')';
      ctx.lineWidth = 2 + 8 * a;
      ctx.shadowColor = 'rgba(230,200,255,' + a + ')';
      ctx.shadowBlur = 24;
      ctx.beginPath();
      ctx.moveTo(f.ax, f.ay);
      ctx.lineTo(f.bx, f.by);
      ctx.stroke();
    }
    ctx.restore();
  }

  // 暴击爆闪：一圈扩散的金色光环 + 星芒
  function drawBursts() {
    if (!bursts.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const b of bursts) {
      const p = b.t / b.dur;
      const a = 1 - p;
      const r = 14 + 78 * p;
      ctx.strokeStyle = 'rgba(255,214,120,' + a * 0.85 + ')';
      ctx.lineWidth = 2 + 4 * a;
      ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 2;
      for (let i = 0; i < 8; i++) {
        const ang = p * 1.6 + i * Math.PI / 4;
        ctx.strokeStyle = 'rgba(255,240,200,' + a * 0.55 + ')';
        ctx.beginPath();
        ctx.moveTo(b.x + Math.cos(ang) * r * 0.45, b.y + Math.sin(ang) * r * 0.45);
        ctx.lineTo(b.x + Math.cos(ang) * r * 1.15, b.y + Math.sin(ang) * r * 1.15);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function heart(x, y, s, filled) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s / 24, s / 24);
    ctx.beginPath();
    ctx.moveTo(0, 7);
    ctx.bezierCurveTo(-12, -4, -6, -14, 0, -7);
    ctx.bezierCurveTo(6, -14, 12, -4, 0, 7);
    ctx.closePath();
    if (filled) {
      ctx.fillStyle = '#ff6b8f';
      ctx.shadowColor = 'rgba(255,107,143,0.8)';
      ctx.shadowBlur = 12;
      ctx.fill();
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.restore();
  }

  function font(size, weight) {
    ctx.font = (weight || 600) + ' ' + size + 'px "Segoe UI", "Microsoft YaHei", system-ui, sans-serif';
  }

  // 一行字放不下就整体缩一点，手机竖屏上标题不会顶出屏幕
  function fitFont(text, maxW, size, weight) {
    font(size, weight);
    const w = ctx.measureText(text).width;
    if (w > maxW && w > 0) {
      size = Math.max(11, Math.floor(size * maxW / w));
      font(size, weight);
    }
    return size;
  }

  function drawHUD() {
    ctx.save();
    ctx.textBaseline = 'top';
    // 分数
    font(20, 600);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillText('得分', 26, 22);
    font(46, 800);
    ctx.shadowColor = 'rgba(180,150,255,0.8)';
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#fff';
    ctx.fillText(String(score), 26, 46);
    ctx.shadowBlur = 0;

    // 最高分
    font(15, 500);
    ctx.fillStyle = 'rgba(255,255,255,0.30)';
    ctx.fillText('最高 ' + best, 28, 100);

    // 命
    for (let i = 0; i < 3; i++) heart(W - 40 - i * 40, 40, 30, i < lives);

    // 暂停按钮（点了就冻住整局）
    const pb = pauseBtnRect();
    ctx.save();
    roundRect(pb.x, pb.y, pb.w, pb.h, 10);
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.28)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillRect(pb.x + 15, pb.y + 10, 4.5, 14);
    ctx.fillRect(pb.x + 24, pb.y + 10, 4.5, 14);
    ctx.restore();

    // 静音提示
    if (muted) {
      ctx.textAlign = 'right';
      font(13, 500);
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillText('静音 · 按 M 恢复', W - 26, 84);
      ctx.textAlign = 'left';
    }

    ctx.restore();
  }

  function drawOverlays() {
    ctx.save();
    ctx.textAlign = 'center';

    if (state === S.IDLE) {
      ctx.fillStyle = 'rgba(8,6,14,0.55)';
      ctx.fillRect(0, 0, W, H);
      ctx.textBaseline = 'middle';
      const t1 = fitFont('虚虚忍者', W * 0.88, Math.min(64, W * 0.09), 800);
      ctx.shadowColor = 'rgba(190,150,255,0.85)';
      ctx.shadowBlur = 30;
      ctx.fillStyle = '#fff';
      ctx.fillText('虚虚忍者', W / 2, H * 0.38);
      ctx.shadowBlur = 0;
      fitFont('按住拖动，划线切开飞上来的头像', W * 0.9, Math.min(20, W * 0.028), 500);
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillText('按住拖动，划线切开飞上来的头像', W / 2, H * 0.38 + t1 * 0.95);

      // 两行小提示，别让新人上来就懵
      ctx.fillStyle = 'rgba(255,255,255,0.34)';
      fitFont('一刀扫过 3 个以上，这一刀的分数翻倍', W * 0.9, Math.min(15, W * 0.021), 500);
      ctx.fillText('一刀扫过 3 个以上，这一刀的分数翻倍', W / 2, H * 0.52);
      fitFont('偶尔冒出「连斩头」：贴着它一直划，别停', W * 0.9, Math.min(15, W * 0.021), 500);
      ctx.fillText('偶尔冒出「连斩头」：贴着它一直划，别停', W / 2, H * 0.52 + Math.min(26, H * 0.038));

      const pulse = 0.55 + 0.45 * Math.sin(performance.now() / 380);
      fitFont('点击开始', W * 0.5, Math.min(24, W * 0.032), 700);
      ctx.fillStyle = 'rgba(255,214,120,' + pulse + ')';
      ctx.fillText('点击开始', W / 2, H * 0.64);
    }

    if (state === S.OVER) {
      ctx.fillStyle = 'rgba(8,6,14,0.72)';
      ctx.fillRect(0, 0, W, H);
      ctx.textBaseline = 'middle';
      fitFont('结束了', W * 0.6, Math.min(54, W * 0.07), 800);
      ctx.fillStyle = '#fff';
      ctx.fillText('结束了', W / 2, H * 0.32);
      fitFont('得分 ' + score, W * 0.8, Math.min(26, W * 0.035), 600);
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.fillText('得分 ' + score, W / 2, H * 0.45);
      fitFont('最高 ' + best, W * 0.7, Math.min(20, W * 0.028), 500);
      ctx.fillStyle = 'rgba(255,214,120,0.85)';
      ctx.fillText('最高 ' + best, W / 2, H * 0.52);
      const pulse = 0.55 + 0.45 * Math.sin(performance.now() / 380);
      fitFont('点击再来一局', W * 0.6, Math.min(24, W * 0.032), 700);
      ctx.fillStyle = 'rgba(255,214,120,' + pulse + ')';
      ctx.fillText('点击再来一局', W / 2, H * 0.66);
    }

    if (state === S.PAUSE) {
      ctx.fillStyle = 'rgba(6,5,12,0.74)';
      ctx.fillRect(0, 0, W, H);
      ctx.textBaseline = 'middle';
      fitFont('已暂停', W * 0.5, Math.min(40, W * 0.06), 800);
      ctx.fillStyle = '#fff';
      ctx.fillText('已暂停', W / 2, H * 0.24);

      const ui = pauseUI();
      const btn = (r, text, primary) => {
        roundRect(r.x, r.y, r.w, r.h, 12);
        ctx.fillStyle = primary ? 'rgba(255,214,120,0.16)' : 'rgba(255,255,255,0.08)';
        ctx.fill();
        ctx.strokeStyle = primary ? 'rgba(255,214,120,0.65)' : 'rgba(255,255,255,0.28)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        fitFont(text, r.w * 0.8, Math.min(22, r.h * 0.44), 700);
        ctx.fillStyle = primary ? 'rgba(255,235,180,0.95)' : 'rgba(255,255,255,0.85)';
        ctx.fillText(text, r.x + r.w / 2, r.y + r.h / 2 + 1);
      };
      btn(ui.resume, '继续', true);
      btn(ui.restart, '重新开始', false);
      btn(ui.quit, '退出到标题', false);

      // 音量滑条
      const t = ui.track;
      const shown = muted ? 0 : volume;
      ctx.textAlign = 'left';
      fitFont('音量', W * 0.3, Math.min(16, W * 0.024), 500);
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillText('音量', t.x, t.y - 28);
      ctx.textAlign = 'right';
      ctx.fillText(Math.round(shown * 100) + '%', t.x + t.w, t.y - 28);
      ctx.textAlign = 'center';
      roundRect(t.x, t.y - 3, t.w, 12, 6);
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.fill();
      if (shown > 0) {
        roundRect(t.x, t.y - 3, Math.max(12, t.w * shown), 12, 6);
        ctx.fillStyle = 'rgba(255,214,120,0.8)';
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(t.x + t.w * shown, t.y + 3, 11, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();

      fitFont('拖动调音量 · M 静音 · P / Esc 继续', W * 0.9, Math.min(14, W * 0.021), 500);
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillText('拖动调音量 · M 静音 · P / Esc 继续', W / 2, t.y + 52);
    }

    if (state === S.PLAY && hintAlpha > 0.01) {
      ctx.textBaseline = 'middle';
      fitFont('按住拖动，划过去切', W * 0.8, Math.min(22, W * 0.03), 500);
      ctx.fillStyle = 'rgba(255,255,255,' + hintAlpha * 0.5 + ')';
      ctx.fillText('按住拖动，划过去切', W / 2, H * 0.86);
    }
    ctx.restore();
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawBG();

    ctx.save();
    if (shake > 0.2) ctx.translate(rand(-shake, shake), rand(-shake, shake));

    for (const h of pieces) drawPiece(h);
    for (const h of heads) drawHead(h);
    drawParticles();
    drawFlashes();
    drawBursts();
    drawTrail();

    for (const p of popups) {
      const a = clamp(p.life / p.maxLife, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      font(p.size, 800);
      ctx.shadowColor = 'rgba(255,190,120,0.8)';
      ctx.shadowBlur = 16;
      ctx.fillStyle = 'rgba(' + p.color + ',1)';
      ctx.fillText(p.text, p.x, p.y);
      ctx.restore();
    }
    ctx.restore();

    if (state === S.PLAY) drawHUD();
    drawOverlays();

    if (redFlash > 0.01) {
      ctx.save();
      ctx.fillStyle = 'rgba(255,60,90,' + redFlash * 0.22 + ')';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
  }

  // ---------- 主循环 ----------
  let last = performance.now();
  let acc = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    acc += dt;
    let guard = 0;
    while (acc >= STEP && guard++ < 240) { step(STEP); acc -= STEP; }
    render();
    requestAnimationFrame(frame);
  }

  // ---------- 启动 ----------
  function loadAll() {
    return Promise.all(SPRITES.map(sp => new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => rej(new Error('加载失败: ' + sp.src));
      im.src = sp.src;
    })));
  }

  resize();
  loadAll().then(list => {
    list.forEach((im, i) => (imgs[i] = im));
    requestAnimationFrame(frame);
    // ?play=1 打开就自动开局，分享链接用（省掉点一下开始）
    if (/[?&]play=1/.test(location.search)) startGame();
  }).catch(err => {
    ctx.fillStyle = '#fff';
    ctx.font = '18px sans-serif';
    ctx.fillText(String(err.message || err), 30, 60);
    console.error(err);
  });
})();
</script>
</body>
</html>
